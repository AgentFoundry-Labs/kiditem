name: Office Images
run-name: "office images sha=${{ inputs.expected_git_sha }} correlation=${{ inputs.dispatch_correlation_id }}"

on:
  workflow_dispatch:
    inputs:
      expected_git_sha:
        description: Full immutable release/office SHA selected for this build.
        required: true
        type: string
      dispatch_correlation_id:
        description: Operator-generated UUID used to identify this exact build.
        required: true
        type: string

concurrency:
  group: office-images
  cancel-in-progress: false

jobs:
  identity_guard:
    name: Validate office release identity
    runs-on: ubuntu-latest
    environment: office
    outputs:
      git_sha: ${{ steps.identity.outputs.git_sha }}
    steps:
      - name: Validate branch, SHA, and correlation
        id: identity
        env:
          EXPECTED_GIT_SHA: ${{ inputs.expected_git_sha }}
          DISPATCH_CORRELATION_ID: ${{ inputs.dispatch_correlation_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/release/office" ]] || { echo "Office images must be dispatched from release/office" >&2; exit 2; }
          [[ "$EXPECTED_GIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_git_sha must be full 40-hex SHA" >&2; exit 2; }
          [[ "$DISPATCH_CORRELATION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || { echo "dispatch_correlation_id must be UUID" >&2; exit 2; }
          [[ "$GITHUB_SHA" == "$EXPECTED_GIT_SHA" ]] || { echo "GITHUB_SHA does not match expected immutable SHA" >&2; exit 2; }
          echo "git_sha=$EXPECTED_GIT_SHA" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare office image build
    needs: identity_guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_version: ${{ steps.refs.outputs.app_version }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.identity_guard.outputs.git_sha }}

      - name: Read release version
        id: refs
        run: |
          set -euo pipefail
          app_version="$(tr -d '[:space:]' < VERSION)"
          [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid root VERSION: $app_version" >&2; exit 2; }
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

  build_api:
    name: Build and push office API image
    needs: prepare
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_base: ghcr.io/agentfoundry-labs/kiditem-api
      dockerfile: ./apps/server/Dockerfile
      cache_scope: office-api
      title: KidItem Office API
      app_version: ${{ needs.prepare.outputs.app_version }}
      build_args: |
        API_RUNTIME_BASE_IMAGE=ghcr.io/agentfoundry-labs/kiditem-api-base:node22-chromium-b6503cb2512e
      extra_tags: ghcr.io/agentfoundry-labs/kiditem-api:office-candidate
      preflight_image: ghcr.io/agentfoundry-labs/kiditem-api-base:node22-chromium-b6503cb2512e

  build_web:
    name: Build and push office web image
    needs: prepare
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_base: ghcr.io/agentfoundry-labs/kiditem-web
      dockerfile: ./apps/web/Dockerfile
      cache_scope: office-web
      title: KidItem Office Web
      app_version: ${{ needs.prepare.outputs.app_version }}
      build_args: |
        NEXT_PUBLIC_API_URL=
      extra_tags: ghcr.io/agentfoundry-labs/kiditem-web:office-candidate

  build_gateway_windows:
    name: Build immutable Windows Host Gateway
    needs:
      - identity_guard
      - prepare
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      gateway_artifact_sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.identity_guard.outputs.git_sha }}

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install, build, and test the pinned Gateway train
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          npm run build --workspace=packages/shared
          npm run build --workspace=apps/agent-gateway
          npm run prepack --workspace=apps/agent-gateway
          if ($LASTEXITCODE -ne 0) { throw 'Gateway bundled runtime staging failed.' }
          # Frozen Task 4 Windows sources still build the native JobRunner helper.
          # The immutable Office artifact below exposes only AgentGateway names.
          dotnet publish apps/agent-gateway/windows/KidItem.JobRunner/KidItem.JobRunner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o "$env:RUNNER_TEMP\\kiditem-agent-gateway-native"
          dotnet publish apps/agent-gateway/windows/KidItem.JobRunner.Fixture/KidItem.JobRunner.Fixture.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o "$env:RUNNER_TEMP\\kiditem-agent-gateway-native-fixture"
          $env:KIDITEM_WINDOWS_JOB_RUNNER_PATH = (Join-Path $env:RUNNER_TEMP 'kiditem-agent-gateway-native\\KidItem.JobRunner.exe')
          npm exec --workspace=apps/agent-gateway vitest -- run src/platform/windows src/config/gateway-config.spec.ts
          if ($LASTEXITCODE -ne 0) { throw 'Windows Gateway tests failed.' }
          npm run postpack --workspace=apps/agent-gateway
          if ($LASTEXITCODE -ne 0) { throw 'Gateway bundled runtime cleanup failed.' }

      - name: Run Windows-native Gateway deployment fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/__tests__/office-windows-native-runtime.fixture.ps1 `
            -AgentGatewayPath (Join-Path $env:RUNNER_TEMP 'kiditem-agent-gateway-native\\KidItem.JobRunner.exe') `
            -FixturePath (Join-Path $env:RUNNER_TEMP 'kiditem-agent-gateway-native-fixture\\KidItem.JobRunner.Fixture.exe') `
            -GatewayEntrypoint (Resolve-Path 'apps/agent-gateway/dist/main.cjs') `
            -DeploymentScript (Resolve-Path 'deploy/office/apply-deployment.ps1')

      - name: Build and verify the immutable Windows Gateway archive
        id: bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveRoot = Join-Path $env:RUNNER_TEMP 'kiditem-agent-gateway-package'
          $verifyRoot = Join-Path $env:RUNNER_TEMP 'kiditem-agent-gateway-verify'
          $zip = Join-Path $env:RUNNER_TEMP 'kiditem-agent-gateway-windows-x64.zip'
          Remove-Item -LiteralPath $archiveRoot, $verifyRoot, $zip -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $archiveRoot | Out-Null

          npm pack --workspace=apps/agent-gateway
          $gatewayTgz = Get-ChildItem -LiteralPath . -Filter 'kiditem-agent-gateway-*.tgz' | Select-Object -First 1
          if ($null -eq $gatewayTgz) { throw 'Gateway package was not produced.' }
          Copy-Item -LiteralPath $gatewayTgz.FullName -Destination (Join-Path $archiveRoot 'agent-gateway.tgz')
          Remove-Item -LiteralPath $gatewayTgz.FullName -Force
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'kiditem-agent-gateway-native\\KidItem.JobRunner.exe') -Destination (Join-Path $archiveRoot 'KidItem.AgentGateway.exe')

          node --input-type=module -e "import { writeFileSync } from 'node:fs'; import { GATEWAY_RUNTIME_TRAIN } from './packages/shared/dist/agent-runtime/index.js'; writeFileSync(process.argv[1], JSON.stringify({ schemaVersion: 1, platform: 'windows', ...GATEWAY_RUNTIME_TRAIN }, null, 2) + '\\n');" (Join-Path $archiveRoot 'gateway-runtime-contract.json')
          Compress-Archive -Path (Join-Path $archiveRoot '*') -DestinationPath $zip -CompressionLevel Optimal

          Expand-Archive -LiteralPath $zip -DestinationPath $verifyRoot
          $verifyPackage = Join-Path $verifyRoot 'package'
          New-Item -ItemType Directory -Path $verifyPackage | Out-Null
          tar -xf (Join-Path $verifyRoot 'agent-gateway.tgz') -C $verifyRoot
          $runtimeContract = Get-Content -LiteralPath (Join-Path $verifyRoot 'gateway-runtime-contract.json') -Raw | ConvertFrom-Json
          if ($runtimeContract.platform -ne 'windows' -or $runtimeContract.nodeMajor -ne 22 -or $runtimeContract.codexVersion -ne '0.149.1' -or $runtimeContract.claudeVersion -ne '2.1.245' -or $runtimeContract.mcpProtocolRevision -ne '2026-07-28') { throw 'Gateway runtime contract is invalid.' }
          function Assert-BundledCliVersion {
            param(
              [Parameter(Mandatory = $true)][string]$Name,
              [Parameter(Mandatory = $true)][string]$Executable,
              [Parameter(Mandatory = $true)][string[]]$Arguments,
              [Parameter(Mandatory = $true)][string]$ExpectedVersion
            )
            $output = & $Executable @Arguments 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            $boundedOutput = $output.Trim()
            if ($boundedOutput.Length -gt 256) { $boundedOutput = $boundedOutput.Substring(0, 256) }
            if ($exitCode -ne 0) { throw "$Name version command failed." }
            $accepted = if ($Name -eq 'Codex') {
              @($ExpectedVersion, "codex $ExpectedVersion", "codex-cli $ExpectedVersion")
            } else {
              @($ExpectedVersion, "claude $ExpectedVersion", "$ExpectedVersion (Claude Code)", "Claude Code $ExpectedVersion")
            }
            if ($accepted -notcontains $boundedOutput) { throw "$Name version does not match the immutable Gateway runtime contract." }
          }
          Assert-BundledCliVersion -Name Codex -Executable node -Arguments @((Join-Path $verifyPackage 'node_modules\\@openai\\codex\\bin\\codex.js'), '--version') -ExpectedVersion '0.149.1'
          Assert-BundledCliVersion -Name Claude -Executable (Join-Path $verifyPackage 'node_modules\\@anthropic-ai\\claude-code\\bin\\claude.exe') -Arguments @('--version') -ExpectedVersion '2.1.245'
          # Run the unpacked Windows Job Object fixture: malformed structured
          # input must be rejected without ever creating a listener or shell.
          '{"unexpected":true}' | & (Join-Path $verifyRoot 'KidItem.AgentGateway.exe')
          if ($LASTEXITCODE -ne 64) { throw 'unpacked Windows Job Object helper rejected malformed input incorrectly.' }
          $global:LASTEXITCODE = 0

          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          exit 0

      - name: Upload immutable Windows Gateway archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: office-gateway-windows-${{ needs.identity_guard.outputs.git_sha }}
          path: ${{ runner.temp }}/kiditem-agent-gateway-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  publish_manifest:
    name: Publish immutable office bundle
    needs:
      - identity_guard
      - prepare
      - build_api
      - build_web
      - build_gateway_windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.identity_guard.outputs.git_sha }}

      - name: Download exact Windows Gateway archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          name: office-gateway-windows-${{ needs.identity_guard.outputs.git_sha }}
          path: gateway-artifact

      - name: Create deployment manifest and operator bundle
        env:
          GIT_SHA: ${{ needs.identity_guard.outputs.git_sha }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          API_IMAGE: ${{ needs.build_api.outputs.image_ref }}
          API_DIGEST: ${{ needs.build_api.outputs.digest }}
          WEB_IMAGE: ${{ needs.build_web.outputs.image_ref }}
          WEB_DIGEST: ${{ needs.build_web.outputs.digest }}
          GATEWAY_ARTIFACT_SHA256: ${{ needs.build_gateway_windows.outputs.gateway_artifact_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p office-bundle
          gateway_artifact='kiditem-agent-gateway-windows-x64.zip'
          test -f "gateway-artifact/$gateway_artifact"
          test "$GATEWAY_ARTIFACT_SHA256" = "$(sha256sum "gateway-artifact/$gateway_artifact" | awk '{print $1}')"
          unzip -p "gateway-artifact/$gateway_artifact" gateway-runtime-contract.json > office-bundle/gateway-runtime-contract.json
          jq -e '
            .schemaVersion == 1 and
            .platform == "windows" and
            .nodeMajor == 22 and
            .controlRevision == "kiditem-gateway-control-v1" and
            .cliContractIdentity == "office-cli-contract-v2" and
            .mcpProtocolRevision == "2026-07-28" and
            .codexVersion == "0.149.1" and
            .claudeVersion == "2.1.245"
          ' office-bundle/gateway-runtime-contract.json >/dev/null
          jq -n \
            --arg gitSha "$GIT_SHA" \
            --arg appVersion "$APP_VERSION" \
            --arg apiImage "$API_IMAGE" \
            --arg apiDigest "$API_DIGEST" \
            --arg webImage "$WEB_IMAGE" \
            --arg webDigest "$WEB_DIGEST" \
            --arg gatewayArtifact "$gateway_artifact" \
            --arg gatewayArtifactSha256 "$GATEWAY_ARTIFACT_SHA256" \
            --slurpfile gatewayRuntime office-bundle/gateway-runtime-contract.json \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              schemaVersion: 2,
              environment: "office",
              sourceRef: "refs/heads/release/office",
              gitSha: $gitSha,
              appVersion: $appVersion,
              apiImage: $apiImage,
              apiDigest: $apiDigest,
              webImage: $webImage,
              webDigest: $webDigest,
              gatewayArtifact: $gatewayArtifact,
              gatewayArtifactSha256: $gatewayArtifactSha256,
              gatewayRuntime: $gatewayRuntime[0],
              createdAt: $createdAt,
              workflowRunUrl: $runUrl
            }' > office-bundle/office-deployment.json
          cp deploy/office/compose.office.yml office-bundle/
          cp deploy/office/nginx.conf office-bundle/
          cp deploy/office/apply-deployment.ps1 office-bundle/
          cp deploy/office/gateway-launcher.cjs office-bundle/
          cp "gateway-artifact/$gateway_artifact" office-bundle/

      - name: Upload office deployment bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: office-deployment-${{ needs.identity_guard.outputs.git_sha }}
          path: office-bundle/
          if-no-files-found: error
          retention-days: 30

      - name: Summarize immutable image refs
        env:
          API_IMAGE: ${{ needs.build_api.outputs.image_ref }}
          WEB_IMAGE: ${{ needs.build_web.outputs.image_ref }}
          GIT_SHA: ${{ needs.identity_guard.outputs.git_sha }}
        run: |
          {
            echo "## Office image bundle"
            echo ""
            echo "- Git SHA: \`$GIT_SHA\`"
            echo "- API: \`$API_IMAGE\`"
            echo "- Web: \`$WEB_IMAGE\`"
            echo "- Runtime deployment is a separate, local operator action."
          } >> "$GITHUB_STEP_SUMMARY"
