name: Office Images
run-name: "office images sha=${{ inputs.expected_git_sha }} correlation=${{ inputs.dispatch_correlation_id }}"

on:
  workflow_dispatch:
    inputs:
      expected_git_sha:
        description: Full immutable release/office SHA selected for this build.
        required: true
        type: string
      dispatch_correlation_id:
        description: Operator-generated UUID used to identify this exact build.
        required: true
        type: string

concurrency:
  group: office-images
  cancel-in-progress: false

jobs:
  identity_guard:
    name: Validate office release identity
    runs-on: ubuntu-latest
    environment: office
    outputs:
      git_sha: ${{ steps.identity.outputs.git_sha }}
    steps:
      - name: Validate branch, SHA, and correlation
        id: identity
        env:
          EXPECTED_GIT_SHA: ${{ inputs.expected_git_sha }}
          DISPATCH_CORRELATION_ID: ${{ inputs.dispatch_correlation_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/release/office" ]] || { echo "Office images must be dispatched from release/office" >&2; exit 2; }
          [[ "$EXPECTED_GIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_git_sha must be full 40-hex SHA" >&2; exit 2; }
          [[ "$DISPATCH_CORRELATION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || { echo "dispatch_correlation_id must be UUID" >&2; exit 2; }
          [[ "$GITHUB_SHA" == "$EXPECTED_GIT_SHA" ]] || { echo "GITHUB_SHA does not match expected immutable SHA" >&2; exit 2; }
          echo "git_sha=$EXPECTED_GIT_SHA" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare office image build
    needs: identity_guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_version: ${{ steps.refs.outputs.app_version }}
      develop_sha: ${{ steps.refs.outputs.develop_sha }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.identity_guard.outputs.git_sha }}
          fetch-depth: 0

      - name: Read release version and promoted develop identity
        id: refs
        env:
          RELEASE_SHA: ${{ needs.identity_guard.outputs.git_sha }}
        run: |
          set -euo pipefail
          app_version="$(tr -d '[:space:]' < VERSION)"
          [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid root VERSION: $app_version" >&2; exit 2; }
          read -r -a parents <<<"$(git show -s --format=%P "$RELEASE_SHA")"
          [[ "${#parents[@]}" -eq 2 ]] || { echo "release/office must be a two-parent promotion merge" >&2; exit 2; }
          develop_sha="$(git rev-parse "${RELEASE_SHA}^2")"
          git fetch --no-tags origin develop
          git merge-base --is-ancestor "$develop_sha" origin/develop
          release_tree="$(git rev-parse "${RELEASE_SHA}^{tree}")"
          develop_tree="$(git rev-parse "${develop_sha}^{tree}")"
          [[ "$release_tree" == "$develop_tree" ]] || { echo "release/office tree differs from its promoted develop parent" >&2; exit 2; }
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "develop_sha=$develop_sha" >> "$GITHUB_OUTPUT"

  build_api:
    name: Build and push office API image
    needs: prepare
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_base: ghcr.io/agentfoundry-labs/kiditem-api
      dockerfile: ./apps/server/Dockerfile
      cache_scope: office-api
      title: KidItem Office API
      app_version: ${{ needs.prepare.outputs.app_version }}
      build_args: |
        API_RUNTIME_BASE_IMAGE=ghcr.io/agentfoundry-labs/kiditem-api-base:node22-chromium-b6503cb2512e
      extra_tags: ghcr.io/agentfoundry-labs/kiditem-api:office-candidate
      preflight_image: ghcr.io/agentfoundry-labs/kiditem-api-base:node22-chromium-b6503cb2512e

  build_web:
    name: Build and push office web image
    needs: prepare
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_base: ghcr.io/agentfoundry-labs/kiditem-web
      dockerfile: ./apps/web/Dockerfile
      cache_scope: office-web
      title: KidItem Office Web
      app_version: ${{ needs.prepare.outputs.app_version }}
      build_args: |
        NEXT_PUBLIC_API_URL=
      extra_tags: ghcr.io/agentfoundry-labs/kiditem-web:office-candidate

  reuse_gateway_windows:
    name: Reuse validated Windows Gateway
    needs:
      - identity_guard
      - prepare
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      gateway_artifact_sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - name: Resolve exact successful develop package run
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVELOP_SHA: ${{ needs.prepare.outputs.develop_sha }}
        run: |
          set -euo pipefail
          runs_json="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/develop-gateway-package.yml/runs" \
            -f branch=develop \
            -f event=push \
            -f head_sha="$DEVELOP_SHA" \
            -f per_page=10)"
          run_json="$(jq -c --arg sha "$DEVELOP_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")] | sort_by(.updated_at) | last // empty' \
            <<<"$runs_json")"
          test -n "$run_json"
          run_id="$(jq -r '.id' <<<"$run_json")"
          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts")"
          artifact_name="develop-gateway-windows-${DEVELOP_SHA}"
          artifact_count="$(jq --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
            <<<"$artifacts_json")"
          test "$artifact_count" -eq 1
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact develop Gateway artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          name: develop-gateway-windows-${{ needs.prepare.outputs.develop_sha }}
          path: gateway-artifact
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify develop provenance, hash, and runtime contract
        id: verify
        env:
          DEVELOP_SHA: ${{ needs.prepare.outputs.develop_sha }}
          VALIDATION_RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          validation='gateway-artifact/gateway-validation.json'
          archive='gateway-artifact/kiditem-agent-gateway-windows-x64.zip'
          test -f "$validation"
          test -f "$archive"
          jq -e \
            --arg sha "$DEVELOP_SHA" \
            --argjson runId "$VALIDATION_RUN_ID" \
            '.schemaVersion == 1 and
             .sourceRef == "refs/heads/develop" and
             .gitSha == $sha and
             .gatewayArtifact == "kiditem-agent-gateway-windows-x64.zip" and
             .workflowRunId == $runId and
             (.gatewayArtifactSha256 | test("^[0-9a-f]{64}$"))' \
            "$validation" >/dev/null
          expected_hash="$(jq -r '.gatewayArtifactSha256' "$validation")"
          actual_hash="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual_hash" = "$expected_hash"
          unzip -p "$archive" gateway-runtime-contract.json > gateway-runtime-contract.json
          jq -e '
            .schemaVersion == 1 and
            .platform == "windows" and
            .nodeMajor == 22 and
            .controlRevision == "kiditem-gateway-control-v1" and
            .cliContractIdentity == "office-cli-contract-v2" and
            .mcpProtocolRevision == "2026-07-28" and
            .codexVersion == "0.149.1" and
            .claudeVersion == "2.1.245"
          ' gateway-runtime-contract.json >/dev/null
          echo "sha256=$actual_hash" >> "$GITHUB_OUTPUT"

  publish_manifest:
    name: Publish immutable office bundle
    needs:
      - identity_guard
      - prepare
      - build_api
      - build_web
      - reuse_gateway_windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.identity_guard.outputs.git_sha }}

      - name: Download exact Windows Gateway archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          name: develop-gateway-windows-${{ needs.prepare.outputs.develop_sha }}
          path: gateway-artifact
          repository: ${{ github.repository }}
          run-id: ${{ needs.reuse_gateway_windows.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create deployment manifest and operator bundle
        env:
          GIT_SHA: ${{ needs.identity_guard.outputs.git_sha }}
          DEVELOP_SHA: ${{ needs.prepare.outputs.develop_sha }}
          GATEWAY_VALIDATION_RUN_ID: ${{ needs.reuse_gateway_windows.outputs.run_id }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          API_IMAGE: ${{ needs.build_api.outputs.image_ref }}
          API_DIGEST: ${{ needs.build_api.outputs.digest }}
          WEB_IMAGE: ${{ needs.build_web.outputs.image_ref }}
          WEB_DIGEST: ${{ needs.build_web.outputs.digest }}
          GATEWAY_ARTIFACT_SHA256: ${{ needs.reuse_gateway_windows.outputs.gateway_artifact_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p office-bundle
          gateway_artifact='kiditem-agent-gateway-windows-x64.zip'
          test -f gateway-artifact/gateway-validation.json
          test -f "gateway-artifact/$gateway_artifact"
          jq -e \
            --arg sha "$DEVELOP_SHA" \
            --argjson runId "$GATEWAY_VALIDATION_RUN_ID" \
            --arg hash "$GATEWAY_ARTIFACT_SHA256" \
            '.gitSha == $sha and .workflowRunId == $runId and .gatewayArtifactSha256 == $hash' \
            gateway-artifact/gateway-validation.json >/dev/null
          test "$GATEWAY_ARTIFACT_SHA256" = "$(sha256sum "gateway-artifact/$gateway_artifact" | awk '{print $1}')"
          unzip -p "gateway-artifact/$gateway_artifact" gateway-runtime-contract.json > office-bundle/gateway-runtime-contract.json
          jq -e '
            .schemaVersion == 1 and
            .platform == "windows" and
            .nodeMajor == 22 and
            .controlRevision == "kiditem-gateway-control-v1" and
            .cliContractIdentity == "office-cli-contract-v2" and
            .mcpProtocolRevision == "2026-07-28" and
            .codexVersion == "0.149.1" and
            .claudeVersion == "2.1.245"
          ' office-bundle/gateway-runtime-contract.json >/dev/null
          jq -n \
            --arg gitSha "$GIT_SHA" \
            --arg appVersion "$APP_VERSION" \
            --arg apiImage "$API_IMAGE" \
            --arg apiDigest "$API_DIGEST" \
            --arg webImage "$WEB_IMAGE" \
            --arg webDigest "$WEB_DIGEST" \
            --arg gatewayArtifact "$gateway_artifact" \
            --arg gatewayArtifactSha256 "$GATEWAY_ARTIFACT_SHA256" \
            --slurpfile gatewayRuntime office-bundle/gateway-runtime-contract.json \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              schemaVersion: 2,
              environment: "office",
              sourceRef: "refs/heads/release/office",
              gitSha: $gitSha,
              appVersion: $appVersion,
              apiImage: $apiImage,
              apiDigest: $apiDigest,
              webImage: $webImage,
              webDigest: $webDigest,
              gatewayArtifact: $gatewayArtifact,
              gatewayArtifactSha256: $gatewayArtifactSha256,
              gatewayRuntime: $gatewayRuntime[0],
              createdAt: $createdAt,
              workflowRunUrl: $runUrl
            }' > office-bundle/office-deployment.json
          cp deploy/office/compose.office.yml office-bundle/
          cp deploy/office/nginx.conf office-bundle/
          cp deploy/office/apply-deployment.ps1 office-bundle/
          cp deploy/office/gateway-launcher.cjs office-bundle/
          cp gateway-artifact/gateway-validation.json office-bundle/
          cp "gateway-artifact/$gateway_artifact" office-bundle/

      - name: Upload office deployment bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: office-deployment-${{ needs.identity_guard.outputs.git_sha }}
          path: office-bundle/
          if-no-files-found: error
          retention-days: 30

      - name: Summarize immutable image refs
        env:
          API_IMAGE: ${{ needs.build_api.outputs.image_ref }}
          WEB_IMAGE: ${{ needs.build_web.outputs.image_ref }}
          GIT_SHA: ${{ needs.identity_guard.outputs.git_sha }}
          DEVELOP_SHA: ${{ needs.prepare.outputs.develop_sha }}
          GATEWAY_VALIDATION_RUN_ID: ${{ needs.reuse_gateway_windows.outputs.run_id }}
        run: |
          {
            echo "## Office image bundle"
            echo ""
            echo "- Git SHA: \`$GIT_SHA\`"
            echo "- Validated develop SHA: \`$DEVELOP_SHA\`"
            echo "- Gateway validation run: \`$GATEWAY_VALIDATION_RUN_ID\`"
            echo "- API: \`$API_IMAGE\`"
            echo "- Web: \`$WEB_IMAGE\`"
            echo "- Runtime deployment is a separate, local operator action."
          } >> "$GITHUB_STEP_SUMMARY"
