name: Develop Validation

on:
  workflow_dispatch:

concurrency:
  group: develop-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    name: Develop full validation
    runs-on: ubuntu-latest
    # 빌드 3.5분 + web 단위 11분 뒤 Testcontainers 전체 PG가 돈다. 20분이면 PG 도중에
    # 취소된다(run 34856574982). 수동 실행 전용이라 PR 체크 시간과 무관하다.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://kiditem_ci:kiditem_ci@localhost:5432/kiditem_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build deployable workspaces
        env:
          # packages/shared 의 tsup DTS worker 는 runner 기본 heap(1792MB)에서
          # ERR_WORKER_OUT_OF_MEMORY 로 죽는다. 같은 단계의 templates/server/web
          # build 도 이 한도 안에서 돈다.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=packages/templates
          # apps/server imports @kiditem/copilotkit-sqlite-runner from dist.
          npm run build --workspace=packages/copilotkit-sqlite-runner
          npm run build --workspace=apps/server
          npm run build --workspace=apps/web

      - name: Run web unit tests
        run: npm exec --workspace=apps/web vitest -- run

      - name: Check the extension runtime bundle and types
        run: npm run extension:check

      - name: Unit-test the extension TypeScript sources
        run: npm run extension:test

      - name: Run extension tests
        run: node --test extensions/tests/*.test.mjs extensions/tests/*/*.test.mjs

      - name: Test integration runtime helpers
        run: npm exec --workspace=apps/server vitest -- run src/test-helpers/__tests__/postgres-global-setup.spec.ts src/test-helpers/__tests__/real-prisma.spec.ts

      - name: Run PostgreSQL integration tests
        run: npm run test:integration
