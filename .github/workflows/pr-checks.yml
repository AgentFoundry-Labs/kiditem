name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - main
      - release/office
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-hygiene:
    name: PR hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check diff formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "${BASE_SHA}...HEAD"

      - name: Check agent instruction hygiene
        run: node scripts/check-agents-hygiene.mjs

  windows_gateway_package:
    name: Windows Gateway package
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Build and package the native Gateway
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --test scripts/__tests__/office-deployment-contract.test.mjs
          node --test scripts/__tests__/office-gateway-launcher.test.mjs
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('deploy/office/apply-deployment.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'apply-deployment.ps1 failed PowerShell parser validation.' }
          npm ci
          npm run build --workspace=packages/shared
          npm run build --workspace=apps/agent-gateway
          npm run prepack --workspace=apps/agent-gateway
          if ($LASTEXITCODE -ne 0) { throw 'Gateway bundled runtime staging failed.' }
          # Frozen Task 4 Windows sources still build the native JobRunner helper.
          # The Office bundle is tested separately with the final AgentGateway names.
          dotnet publish apps/agent-gateway/windows/KidItem.JobRunner/KidItem.JobRunner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o "$env:RUNNER_TEMP\\kiditem-agent-gateway-native"
          dotnet publish apps/agent-gateway/windows/KidItem.JobRunner.Fixture/KidItem.JobRunner.Fixture.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o "$env:RUNNER_TEMP\\kiditem-agent-gateway-native-fixture"
          $env:KIDITEM_WINDOWS_JOB_RUNNER_PATH = (Join-Path $env:RUNNER_TEMP 'kiditem-agent-gateway-native\\KidItem.JobRunner.exe')
          npm exec --workspace=apps/agent-gateway vitest -- run
          if ($LASTEXITCODE -ne 0) { throw 'Windows Gateway tests failed.' }
          npm run postpack --workspace=apps/agent-gateway
          if ($LASTEXITCODE -ne 0) { throw 'Gateway bundled runtime cleanup failed.' }
          & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/__tests__/office-windows-native-runtime.fixture.ps1 `
            -AgentGatewayPath (Join-Path $env:RUNNER_TEMP 'kiditem-agent-gateway-native\\KidItem.JobRunner.exe') `
            -FixturePath (Join-Path $env:RUNNER_TEMP 'kiditem-agent-gateway-native-fixture\\KidItem.JobRunner.Fixture.exe') `
            -GatewayEntrypoint (Resolve-Path 'apps/agent-gateway/dist/main.cjs') `
            -DeploymentScript (Resolve-Path 'deploy/office/apply-deployment.ps1')
          npm pack --workspace=apps/agent-gateway --dry-run
