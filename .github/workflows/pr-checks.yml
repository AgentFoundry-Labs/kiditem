name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - main
      - release/office
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-hygiene:
    name: PR hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Gateway build/unit only runs when its inputs changed (KID-399).
      gateway: ${{ steps.changes.outputs.gateway }}
      # Unit and script-contract jobs only run when something other than docs changed (KID-400).
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check diff formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "${BASE_SHA}...HEAD"

      - name: Check agent instruction hygiene
        run: node scripts/check-agents-hygiene.mjs
      - name: Detect Gateway and code changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "${BASE_SHA}...HEAD" > changed-files.txt
          if grep -Eq '^(apps/agent-gateway/|packages/shared/src/(agent-runtime|identifiers)/|packages/shared/package\.json$|package\.json$|package-lock\.json$|\.github/workflows/pr-checks\.yml$)' changed-files.txt; then
            echo "gateway=true" >> "$GITHUB_OUTPUT"
          else
            echo "gateway=false" >> "$GITHUB_OUTPUT"
          fi
          # Docs-only PRs (Markdown, docs/, templates, LICENSE) skip the unit and script-contract jobs; hygiene still checks them.
          if grep -Evq '^(docs/|\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE\.md)|LICENSE$)|\.md$' changed-files.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f changed-files.txt

  gateway_fast_checks:
    name: Gateway fast checks
    # Skipped unless Gateway sources, the Shared entry points it consumes, the lockfile, or this workflow changed.
    needs: pr-hygiene
    if: needs.pr-hygiene.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Restore node_modules
        id: node-modules
        # Keyed on the lockfile; a hit skips npm ci (about a minute per job, KID-400).
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            scripts/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies without repository lifecycle scripts
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Build and unit-test the Gateway
        run: |
          npm exec --workspace=packages/shared tsup -- src/agent-runtime/index.ts src/identifiers/index.ts --format esm,cjs --no-config --out-dir dist --clean
          npm run build --workspace=apps/agent-gateway
          npm exec --workspace=apps/agent-gateway vitest -- run

  unit_tests:
    name: Shared and server unit tests
    needs: pr-hygiene
    if: needs.pr-hygiene.outputs.code == 'true'
    # PostgreSQL integration specs stay out: they need Testcontainers (develop-validation.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Restore node_modules
        id: node-modules
        # Keyed on the lockfile; a hit skips npm ci (about a minute per job, KID-400).
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            scripts/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies without repository lifecycle scripts
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Build the SQLite native binding
        # --ignore-scripts skips its install script; the runner specs open a real database.
        run: npm rebuild better-sqlite3

      - name: Install ripgrep
        # Architecture specs scan sources with rg.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep

      - name: Generate Prisma client
        env:
          # prisma.config.ts resolves DATABASE_URL at load; generate never connects.
          DATABASE_URL: postgresql://kiditem_ci:kiditem_ci@localhost:5432/kiditem_ci
        run: npx prisma generate

      - name: Build server workspace packages
        # Server specs resolve @kiditem/shared from source; runner and templates resolve from dist.
        run: |
          npm run build --workspace=packages/copilotkit-sqlite-runner
          npm run build --workspace=packages/templates

      - name: Unit-test the shared package
        run: npm exec --workspace=packages/shared vitest -- run

      - name: Unit-test the server
        run: npm exec --workspace=apps/server vitest -- run

      - name: Build shared package JavaScript for extension tests
        # Extension tests import @kiditem/shared runtime JS from dist; the DTS build exhausts the hosted runner heap.
        run: npm exec --workspace=packages/shared tsup -- --no-dts

      - name: Check the extension runtime bundle and types
        # The committed runtime/kiditem-runtime.js must be byte-identical to a fresh build of extensions/src.
        run: npm run extension:check

      - name: Unit-test the extension TypeScript sources
        run: npm run extension:test

      - name: Run extension tests
        # node --test runs one process per file at availableParallelism()-1, which is serial on a 2 vCPU runner.
        # The slow files wait on timers, not CPU, so 8 at once stays inside the job timeout.
        run: node --test --test-concurrency=8 extensions/tests/*.test.mjs extensions/tests/*/*.test.mjs

  script_contract_checks:
    name: Script contract tests
    needs: pr-hygiene
    if: needs.pr-hygiene.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Full history with every branch: the cutover coverage check diffs against
          # origin/release/office and check:schema-artifact-sync diffs against the PR base (KID-399).
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Restore node_modules
        id: node-modules
        # Keyed on the lockfile; a hit skips npm ci (about a minute per job, KID-400).
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            scripts/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies without repository lifecycle scripts
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        env:
          # prisma.config.ts resolves DATABASE_URL at load; generate never connects.
          DATABASE_URL: postgresql://kiditem_ci:kiditem_ci@localhost:5432/kiditem_ci
        run: npx prisma generate

      - name: Build shared package JavaScript
        # Script specs import runtime JS only; the DTS build exhausts the hosted runner heap.
        run: npm exec --workspace=packages/shared tsup -- --no-dts

      - name: Check cutover blocker coverage
        # Diffs the schema against release/office offline; no database or secret is used.
        run: node scripts/check-cutover-blocker-coverage.mjs --base-ref origin/release/office

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep

      - name: Run script contract tests
        run: npm run test:scripts
      - name: Build workspace types for the convention scanners
        # The type-baseline scanners run tsc over apps/server and apps/web, which resolve
        # @kiditem/shared, the runner and templates from dist; the shared DTS worker needs more heap than the runner default.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=packages/copilotkit-sqlite-runner
          npm run build --workspace=packages/templates
      - name: Run the convention scanners
        # check:conventions is the architecture gate (hexagonal, ledger readers, tenant scope, error codes, ...); KID-399 put it in CI.
        run: npm run check:conventions
