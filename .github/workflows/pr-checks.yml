name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - main
      - release/office
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-hygiene:
    name: PR hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check diff formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "${BASE_SHA}...HEAD"

      - name: Check agent instruction hygiene
        run: node scripts/check-agents-hygiene.mjs

  gateway_fast_checks:
    name: Gateway fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Check local Office deployment contracts
        run: |
          node --test scripts/__tests__/office-deployment-contract.test.mjs
          node --test scripts/__tests__/office-gateway-launcher.test.mjs

      - name: Install dependencies without repository lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build and unit-test the Gateway
        run: |
          npm exec --workspace=packages/shared tsup -- src/agent-runtime/index.ts src/identifiers/index.ts --format esm,cjs --no-config --out-dir dist --clean
          npm run build --workspace=apps/agent-gateway
          npm exec --workspace=apps/agent-gateway vitest -- run

  unit_tests:
    name: Shared and server unit tests
    # PostgreSQL integration specs stay out: they need Testcontainers (develop-validation.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without repository lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build the SQLite native binding
        # --ignore-scripts skips its install script; the runner specs open a real database.
        run: npm rebuild better-sqlite3

      - name: Install ripgrep
        # Architecture specs scan sources with rg.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep

      - name: Generate Prisma client
        env:
          # prisma.config.ts resolves DATABASE_URL at load; generate never connects.
          DATABASE_URL: postgresql://kiditem_ci:kiditem_ci@localhost:5432/kiditem_ci
        run: npx prisma generate

      - name: Build server workspace packages
        # Server specs resolve @kiditem/shared from source; runner and templates resolve from dist.
        run: |
          npm run build --workspace=packages/copilotkit-sqlite-runner
          npm run build --workspace=packages/templates

      - name: Unit-test the shared package
        run: npm exec --workspace=packages/shared vitest -- run

      - name: Unit-test the server
        run: npm exec --workspace=apps/server vitest -- run

  script_contract_checks:
    name: Script contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without repository lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        env:
          # prisma.config.ts resolves DATABASE_URL at load; generate never connects.
          DATABASE_URL: postgresql://kiditem_ci:kiditem_ci@localhost:5432/kiditem_ci
        run: npx prisma generate

      - name: Build shared package JavaScript
        # Script specs import runtime JS only; the DTS build exhausts the hosted runner heap.
        run: npm exec --workspace=packages/shared tsup -- --no-dts

      - name: Fetch the Office release schema
        run: git fetch --no-tags --depth=1 origin +refs/heads/release/office:refs/remotes/origin/release/office

      - name: Check cutover blocker coverage
        # Diffs the schema against release/office offline; no database or secret is used.
        run: node scripts/check-cutover-blocker-coverage.mjs --base-ref origin/release/office

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep

      - name: Run script contract tests
        run: npm run test:scripts
