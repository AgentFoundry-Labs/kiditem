name: kiditem-office

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: "4000"
  DATABASE_URL: postgresql://kiditem:${POSTGRES_PASSWORD}@postgres:5432/kiditem
  DIRECT_URL: postgresql://kiditem:${POSTGRES_PASSWORD}@postgres:5432/kiditem
  WEB_ORIGIN: ${OFFICE_ORIGIN}
  CORS_ORIGINS: ${OFFICE_ORIGIN}
  API_SELF_URL: http://api:4000
  S3_REGION: us-east-1
  S3_BUCKET: kiditem
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  CHANNEL_CREDENTIALS_ENCRYPTION_KEY: ${CHANNEL_CREDENTIALS_ENCRYPTION_KEY}
  SOURCING_PLAYWRIGHT_CDP_ENDPOINT: ${SOURCING_PLAYWRIGHT_CDP_ENDPOINT}
  HOME: /var/lib/kiditem-cli
  CODEX_HOME: /var/lib/kiditem-cli/.codex
  CLAUDE_CONFIG_DIR: /var/lib/kiditem-cli/.claude
  AGENT_DURABLE_RUNTIME_RUN_ROOT: /var/lib/kiditem-agent-runs
  DISABLE_AUTOUPDATER: "1"

services:
  postgres:
    image: postgres:17
    container_name: kiditem-postgres
    environment:
      POSTGRES_USER: kiditem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kiditem
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiditem -d kiditem"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: kiditem-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "0.0.0.0:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: kiditem-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb --ignore-existing local/kiditem;
      mc anonymous set download local/kiditem;
      "
    restart: "no"

  api:
    env_file:
      - ${OFFICE_API_ENV_FILE:-C:/workspace/kiditem/apps/server/.env}
    image: ${KIDITEM_API_IMAGE:?KIDITEM_API_IMAGE must be an immutable GHCR digest reference}
    container_name: kiditem-api
    environment:
      <<: *api-environment
    extra_hosts:
      - "${OFFICE_HOST}:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "4000"
    volumes:
      - kiditem-cli-home:/var/lib/kiditem-cli
    stop_grace_period: 10s
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/auth/me').then((r)=>process.exit(r.status===401||r.status===403?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # An operator uses this one-off profile before API startup. It mounts only
  # the non-secret local CLI login home; task records remain in PostgreSQL and
  # runtime processes/state are intentionally current-container only.
  cli-login:
    profiles: ["cli-login"]
    image: ${KIDITEM_API_IMAGE:?KIDITEM_API_IMAGE must be an immutable GHCR digest reference}
    environment:
      # This one-off login container intentionally receives no API env file or
      # service environment. Provider login is the only capability it needs.
      HOME: /var/lib/kiditem-cli
      CODEX_HOME: /var/lib/kiditem-cli/.codex
      CLAUDE_CONFIG_DIR: /var/lib/kiditem-cli/.claude
      DISABLE_AUTOUPDATER: "1"
    volumes:
      - kiditem-cli-home:/var/lib/kiditem-cli
    command: ["codex", "login", "status"]
    restart: "no"

  worker:
    env_file:
      - ${OFFICE_API_ENV_FILE:-C:/workspace/kiditem/apps/server/.env}
    image: ${KIDITEM_API_IMAGE:?KIDITEM_API_IMAGE must be an immutable GHCR digest reference}
    container_name: kiditem-worker
    command: ["node", "dist/worker.js"]
    environment:
      <<: *api-environment
    extra_hosts:
      - "${OFFICE_HOST}:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${KIDITEM_WEB_IMAGE:?KIDITEM_WEB_IMAGE must be an immutable GHCR digest reference}
    container_name: kiditem-web
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: kiditem-nginx
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - C:/ProgramData/Kiditem/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
    external: true
    name: kiditem_pgdata
  minio-data:
    external: true
    name: kiditem_minio-data
  kiditem-cli-home:
