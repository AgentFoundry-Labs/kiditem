services:
  postgres:
    container_name: kiditem-postgres
    image: postgres:17.9
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: kiditem
      POSTGRES_PASSWORD: kiditem
      POSTGRES_DB: kiditem
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiditem"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    container_name: kiditem-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"       # S3 API
      - "9001:9001"       # Web console (http://localhost:9001, minioadmin/minioadmin)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # 브라우저에서 MinIO로 직접 fetch할 수 있도록 CORS 허용
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    container_name: kiditem-minio-init
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/kiditem;
      mc anonymous set public local/kiditem;
      echo 'MinIO bucket kiditem ready (public read)';
      "
    restart: "no"

  # NestJS API and the native Codex/Claude Gateway run on the macOS host.
  # server:
  #   container_name: kiditem-server
  #   build:
  #     context: .
  #     dockerfile: apps/server/Dockerfile
  #   ports:
  #     - "4000:4000"
  #   environment:
  #     DATABASE_URL: postgresql://kiditem:kiditem@postgres:5432/kiditem
  #   env_file:
  #     - apps/server/.env
  #   volumes:
  #     - product-data:/data
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: unless-stopped

  # Optional Python agents also run on the host when explicitly enabled.
  # agents:
  #   container_name: kiditem-agents
  #   build:
  #     context: ./agents
  #   environment:
  #     DATABASE_URL: postgresql://kiditem:kiditem@postgres:5432/kiditem
  #     PYTHONWARNINGS: ignore::UserWarning
  #   env_file:
  #     - agents/.env
  #   volumes:
  #     - product-data:/data
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  pgdata:
  minio-data:
